spring.application.name=assistant-service
server.port=8083
spring.config.import=optional:configserver:http://localhost:9999,optional:file:.env[.properties],optional:file:../.env[.properties]
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.transaction.url=http://localhost:8082
management.endpoints.web.exposure.include=health,info
