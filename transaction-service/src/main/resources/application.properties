spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:configserver:http://localhost:9999
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.datasource.url=jdbc:h2:mem:transaction-db
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.graphql.graphiql.enabled=true
spring.ai.mcp.server.protocol=streamable
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
bank.kafka.topic.transactions-created=bank.transactions.created
bank.transaction.max-amount=1000
resilience4j.circuitbreaker.instances.accountClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountClient.wait-duration-in-open-state=10s
resilience4j.retry.instances.accountClient.max-attempts=3
resilience4j.retry.instances.accountClient.wait-duration=500ms
management.endpoints.web.exposure.include=health,info,circuitbreakers
