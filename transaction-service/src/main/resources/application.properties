spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:configserver:http://localhost:9999
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.datasource.url=jdbc:h2:mem:transaction-db
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.graphql.graphiql.enabled=true
spring.ai.mcp.server.protocol=streamable
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
bank.kafka.topic.transactions-created=bank.transactions.created
bank.transaction.max-amount=1000
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
bank.account-service.url=
management.endpoints.web.exposure.include=health,info,circuitbreakers
